<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#111">Pad mounting: 27 mm piezo disc</text>

  <!-- ===== Cross-section ===== -->
  <text x="20" y="62" font-size="15" font-weight="bold" fill="#111">1. Cross-section</text>
  <text x="20" y="80" font-size="12" fill="#666">(thicknesses exaggerated)</text>

  <!-- hit arrow -->
  <g stroke="#b3261e" stroke-width="3" fill="#b3261e">
    <line x1="240" y1="78" x2="240" y2="104"/>
    <polygon points="232,102 248,102 240,114" stroke="none"/>
  </g>
  <text x="252" y="96" font-size="13" fill="#b3261e" font-weight="bold">hit</text>

  <!-- layers (plate 50 mm = 360 px, 7.2 px/mm) -->
  <rect x="60" y="116" width="360" height="10" fill="#d9c7a7" stroke="#8a7350"/>
  <rect x="60" y="126" width="360" height="18" fill="#bfe3f0" stroke="#3a7c9a"/>
  <rect x="143" y="144" width="194" height="3" fill="#9a9a9a"/>
  <rect x="143" y="147" width="194" height="5" fill="#c9a43a" stroke="#8a6f1e"/>
  <rect x="168" y="152" width="144" height="5" fill="#e8e8e8" stroke="#8c8c8c"/>
  <rect x="180" y="157" width="120" height="3" fill="#e3b04b" opacity="0.8"/>
  <rect x="60" y="160" width="360" height="30" fill="#3d3d3d" stroke="#222"/>
  <path d="M40 202 q40 -10 80 0 t80 0 t80 0 t80 0 t80 0 v20 h-400 z" fill="#f2d0b5" stroke="#c99a78"/>

  <!-- leader lines + labels -->
  <g stroke="#777" stroke-width="1">
    <line x1="420" y1="121" x2="470" y2="112"/>
    <line x1="420" y1="135" x2="470" y2="134"/>
    <line x1="337" y1="145" x2="470" y2="156"/>
    <line x1="337" y1="149" x2="470" y2="178"/>
    <line x1="312" y1="155" x2="470" y2="200"/>
    <line x1="300" y1="159" x2="470" y2="222"/>
    <line x1="420" y1="178" x2="470" y2="244"/>
    <line x1="420" y1="210" x2="470" y2="266"/>
  </g>
  <g font-size="13" fill="#111">
    <text x="476" y="116"><tspan font-weight="bold">Cover</tspan>: fabric, or 2–3 mm EVA foam</text>
    <text x="476" y="138"><tspan font-weight="bold">Rigid plate</tspan> 40–60 mm: 2–3 mm acrylic or PCB scrap</text>
    <text x="476" y="160"><tspan font-weight="bold">Thin</tspan> double-sided tape, later epoxy / hot glue</text>
    <text x="476" y="182"><tspan font-weight="bold">Brass</tspan> 27 mm (black wire, GND), glued to the plate</text>
    <text x="476" y="204"><tspan font-weight="bold">Ceramic</tspan> 20 mm (red wire): brittle, never loaded</text>
    <text x="476" y="226"><tspan font-weight="bold">Kapton tape</tspan> or a dot of hot glue over the ceramic</text>
    <text x="476" y="248"><tspan font-weight="bold">Foam</tspan> 3–5 mm neoprene (mouse pad) or EVA</text>
    <text x="476" y="270"><tspan font-weight="bold">Body</tspan> / outside of the shoe / glove palm</text>
  </g>

  <!-- ===== Top view ===== -->
  <text x="20" y="320" font-size="15" font-weight="bold" fill="#111">2. Top view (cover removed) and wiring</text>

  <!-- plate 50 mm, 3.6 px/mm -->
  <circle cx="190" cy="450" r="90" fill="#bfe3f0" stroke="#3a7c9a" stroke-width="2"/>
  <circle cx="190" cy="450" r="48.6" fill="#c9a43a" stroke="#8a6f1e" stroke-width="2"/>
  <circle cx="190" cy="450" r="36" fill="#e8e8e8" stroke="#8c8c8c" stroke-width="2"/>
  <text x="190" y="455" font-size="11" fill="#555" text-anchor="middle">ceramic</text>
  <text x="190" y="418" font-size="10" fill="#6b5410" text-anchor="middle">brass</text>

  <!-- short leads from the disc to the cable end -->
  <path d="M200 440 C 225 440, 240 470, 258 492" stroke="#c62828" stroke-width="2.5" fill="none"/>
  <path d="M232 470 C 240 480, 246 490, 254 498" stroke="#111" stroke-width="2.5" fill="none"/>
  <circle cx="200" cy="440" r="3.5" fill="#888"/>
  <circle cx="232" cy="470" r="3.5" fill="#888"/>

  <!-- cable -->
  <path d="M258 500 C 300 540, 360 560, 440 575" stroke="#555" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- hot glue blob over joints + cable end -->
  <ellipse cx="258" cy="497" rx="24" ry="15" fill="#fff6c8" stroke="#c9a43a" stroke-width="1.5" opacity="0.85"/>
  <!-- tape on the strap -->
  <rect x="352" y="548" width="18" height="26" fill="#2b4f8a" opacity="0.85" transform="rotate(-25 361 561)"/>

  <!-- callouts -->
  <g stroke="#777" stroke-width="1">
    <line x1="282" y1="490" x2="470" y2="372"/>
    <line x1="232" y1="470" x2="470" y2="420"/>
    <line x1="370" y1="556" x2="470" y2="480"/>
    <line x1="440" y1="575" x2="470" y2="540"/>
  </g>
  <g font-size="13" fill="#111">
    <text x="476" y="360"><tspan font-weight="bold">a.</tspan> Glue the cable end on the plate, next to the disc.</text>
    <text x="476" y="376"><tspan font-weight="bold">b.</tspan> Cover joints + cable end with a hot glue blob:</text>
    <text x="494" y="392">the plate holds the cable, not the thin leads.</text>
    <text x="476" y="416"><tspan font-weight="bold">c.</tspan> Shorten the disc's leads to ~3 cm and solder:</text>
    <text x="494" y="432"><tspan fill="#c62828" font-weight="bold">red</tspan> → cable core, <tspan font-weight="bold">black</tspan> → cable shield.</text>
    <text x="476" y="476"><tspan font-weight="bold">d.</tspan> Tape the cable again on the strap, a few cm away.</text>
    <text x="476" y="536"><tspan font-weight="bold">e.</tspan> Other end: 3.5 mm mono plug,</text>
    <text x="494" y="552">tip = core (red), sleeve = shield (black, GND).</text>
  </g>
</svg>
