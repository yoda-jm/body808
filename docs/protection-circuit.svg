<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#111">One pad input with protection (build 6 of these, one per pin A0..A5)</text>

  <!-- zones -->
  <rect x="15" y="60" width="165" height="345" fill="#fdf3e6" stroke="#c98a3a" stroke-dasharray="6 4"/>
  <text x="25" y="80" font-size="13" fill="#9a6420">ON THE BODY</text>
  <rect x="200" y="60" width="440" height="345" fill="#eaf3fb" stroke="#3a7cc9" stroke-dasharray="6 4"/>
  <text x="210" y="80" font-size="13" fill="#2a5f9e">PROTECTION BOARD (next to the Mega)</text>

  <g stroke="#111" stroke-width="2.5" fill="none">
    <!-- rails -->
    <line x1="520" y1="110" x2="770" y2="110"/>
    <line x1="110" y1="360" x2="770" y2="360"/>
    <!-- piezo -->
    <line x1="110" y1="200" x2="110" y2="255"/>
    <line x1="85" y1="255" x2="135" y2="255"/>
    <rect x="92" y="261" width="36" height="22" fill="#fff"/>
    <line x1="85" y1="289" x2="135" y2="289"/>
    <line x1="110" y1="289" x2="110" y2="360"/>
    <!-- signal wire -->
    <line x1="110" y1="200" x2="330" y2="200"/>
    <!-- R1 1M -->
    <line x1="240" y1="200" x2="240" y2="245"/>
    <rect x="230" y="245" width="20" height="70" fill="#fff"/>
    <line x1="240" y1="315" x2="240" y2="360"/>
    <!-- R2 10k -->
    <rect x="330" y="190" width="80" height="20" fill="#fff"/>
    <line x1="410" y1="200" x2="770" y2="200"/>
    <!-- D1 to +5V -->
    <line x1="520" y1="200" x2="520" y2="168"/>
    <line x1="520" y1="132" x2="520" y2="110"/>
    <!-- D2 from GND -->
    <line x1="520" y1="360" x2="520" y2="288"/>
    <line x1="520" y1="252" x2="520" y2="200"/>
  </g>
  <!-- diodes: triangle points to the cathode bar -->
  <g stroke="#111" stroke-width="2.5" fill="#111">
    <polygon points="503,168 537,168 520,136"/>
    <line x1="503" y1="132" x2="537" y2="132"/>
    <polygon points="503,288 537,288 520,256"/>
    <line x1="503" y1="252" x2="537" y2="252"/>
  </g>
  <!-- junction dots -->
  <g fill="#111">
    <circle cx="240" cy="200" r="5"/><circle cx="520" cy="200" r="5"/>
    <circle cx="240" cy="360" r="5"/><circle cx="520" cy="360" r="5"/>
  </g>

  <!-- Mega -->
  <rect x="770" y="60" width="170" height="345" rx="8" fill="#0f6e74"/>
  <text x="855" y="235" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Arduino</text>
  <text x="855" y="256" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Mega 2560</text>
  <g fill="#fff" font-size="14" font-weight="bold">
    <text x="782" y="115">5V</text>
    <text x="782" y="205">A0 … A5</text>
    <text x="782" y="365">GND</text>
  </g>

  <!-- labels -->
  <g font-size="14" fill="#111">
    <text x="22" y="180" font-weight="bold">PZ piezo disc</text>
    <text x="22" y="198" font-size="12">red</text>
    <text x="22" y="350" font-size="12">black</text>
    <text x="22" y="320" font-size="12" fill="#b3261e">hard hit:</text>
    <text x="22" y="336" font-size="12" fill="#b3261e">±20…100 V</text>

    <text x="258" y="270" font-weight="bold">R1 1 MΩ</text>
    <text x="258" y="287" font-size="12">bleeds the charge,</text>
    <text x="258" y="302" font-size="12">sets the decay</text>

    <text x="370" y="178" font-weight="bold" text-anchor="middle">R2 10 kΩ</text>
    <text x="370" y="232" font-size="12" text-anchor="middle">limits the current</text>
    <text x="370" y="247" font-size="12" text-anchor="middle">into the diodes</text>

    <text x="548" y="150" font-weight="bold">D1 BAT85</text>
    <text x="548" y="166" font-size="12">band → +5V</text>
    <text x="548" y="270" font-weight="bold">D2 BAT85</text>
    <text x="548" y="286" font-size="12">band → signal</text>

    <text x="548" y="192" font-size="12" fill="#1b7a3a">pin sees −0.3 … 5.3 V</text>
    <text x="170" y="192" font-size="12" fill="#555">cable</text>
  </g>

  <!-- notes -->
  <g font-size="13" fill="#111">
    <text x="20" y="435">• Pin limits (ATmega2560 datasheet): −0.5 V … Vcc + 0.5 V. Without D1/D2 and R2, a stomp can kill the analog input or the chip.</text>
    <text x="20" y="457">• Schottky diodes (BAT85, 1N5817, BAT54S…) clamp at ~0.3 V, before the chip's internal diodes (~0.6 V) conduct.</text>
    <text x="20" y="479">• All GNDs common. One shared +5V and GND rail for the 6 channels. Shielded cable: shield = GND = piezo black.</text>
    <text x="20" y="501">• Check D1/D2 orientation with a multimeter (diode mode) BEFORE plugging into the Mega.</text>
  </g>
</svg>
