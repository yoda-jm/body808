<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#111">One pad input with protection (build 6 of these, one per pin A0..A5)</text>

  <!-- zones -->
  <rect x="15" y="60" width="165" height="345" fill="#fdf3e6" stroke="#c98a3a" stroke-dasharray="6 4"/>
  <text x="25" y="80" font-size="13" fill="#9a6420">ON THE BODY</text>
  <rect x="200" y="60" width="530" height="345" fill="#eaf3fb" stroke="#3a7cc9" stroke-dasharray="6 4"/>
  <text x="210" y="80" font-size="13" fill="#2a5f9e">PROTECTION BOARD (next to the Mega)</text>

  <g stroke="#111" stroke-width="2.5" fill="none">
    <!-- GND rail -->
    <line x1="110" y1="360" x2="770" y2="360"/>
    <!-- piezo -->
    <line x1="110" y1="200" x2="110" y2="255"/>
    <line x1="85" y1="255" x2="135" y2="255"/>
    <rect x="92" y="261" width="36" height="22" fill="#fff"/>
    <line x1="85" y1="289" x2="135" y2="289"/>
    <line x1="110" y1="289" x2="110" y2="360"/>
    <!-- signal wire to R2 -->
    <line x1="110" y1="200" x2="330" y2="200"/>
    <!-- R1 1M -->
    <line x1="240" y1="200" x2="240" y2="245"/>
    <rect x="230" y="245" width="20" height="70" fill="#fff"/>
    <line x1="240" y1="315" x2="240" y2="360"/>
    <!-- R2 10k -->
    <rect x="330" y="190" width="80" height="20" fill="#fff"/>
    <line x1="410" y1="200" x2="590" y2="200"/>
    <!-- D1 zener from GND up to the node -->
    <line x1="500" y1="360" x2="500" y2="288"/>
    <line x1="500" y1="252" x2="500" y2="200"/>
    <!-- R3 1k -->
    <rect x="590" y="190" width="70" height="20" fill="#fff"/>
    <line x1="660" y1="200" x2="770" y2="200"/>
  </g>
  <!-- zener: triangle points to the cathode bar, bar with bent ends -->
  <g stroke="#111" stroke-width="2.5">
    <polygon points="483,288 517,288 500,256" fill="#111"/>
    <polyline points="477,258 483,252 517,252 523,246" fill="none"/>
  </g>
  <!-- junction dots -->
  <g fill="#111">
    <circle cx="240" cy="200" r="5"/><circle cx="500" cy="200" r="5"/>
    <circle cx="240" cy="360" r="5"/><circle cx="500" cy="360" r="5"/>
  </g>

  <!-- Mega -->
  <rect x="770" y="60" width="170" height="345" rx="8" fill="#0f6e74"/>
  <text x="855" y="265" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Arduino</text>
  <text x="855" y="286" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">Mega 2560</text>
  <g fill="#fff" font-size="14" font-weight="bold">
    <text x="782" y="205">A0 … A5</text>
    <text x="782" y="365">GND</text>
  </g>

  <!-- labels -->
  <g font-size="14" fill="#111">
    <text x="22" y="180" font-weight="bold">PZ piezo disc</text>
    <text x="22" y="198" font-size="12">red</text>
    <text x="22" y="350" font-size="12">black</text>
    <text x="22" y="320" font-size="12" fill="#b3261e">hard hit:</text>
    <text x="22" y="336" font-size="12" fill="#b3261e">±20…100 V</text>

    <text x="258" y="270" font-weight="bold">R1 1 MΩ</text>
    <text x="258" y="287" font-size="12">bleeds the charge,</text>
    <text x="258" y="302" font-size="12">sets the decay</text>

    <text x="370" y="178" font-weight="bold" text-anchor="middle">R2 10 kΩ</text>
    <text x="370" y="232" font-size="12" text-anchor="middle">limits the current</text>
    <text x="370" y="247" font-size="12" text-anchor="middle">into the zener</text>

    <text x="528" y="262" font-weight="bold">D1 zener 5.1 V</text>
    <text x="528" y="278" font-size="12">BZX55C5V1</text>
    <text x="528" y="294" font-size="12">band (cathode) → signal</text>
    <text x="528" y="310" font-size="12">anode → GND</text>

    <text x="625" y="178" font-weight="bold" text-anchor="middle">R3 1 kΩ</text>
    <text x="625" y="232" font-size="12" text-anchor="middle">protects against</text>
    <text x="625" y="247" font-size="12" text-anchor="middle">negative spikes</text>

    <text x="590" y="130" font-size="12" fill="#1b7a3a">pin: ≈ −0.5 … 5.3 V,</text>
    <text x="590" y="146" font-size="12" fill="#1b7a3a">&lt; 0.5 mA worst case</text>
    <text x="170" y="192" font-size="12" fill="#555">cable</text>
  </g>

  <!-- notes -->
  <g font-size="13" fill="#111">
    <text x="20" y="435">• Pin limits (ATmega2560 datasheet): −0.5 V … Vcc + 0.5 V. Without D1, R2 and R3, a stomp can kill the analog input or the chip.</text>
    <text x="20" y="457">• D1 clamps positive spikes at ~5.1 V. On negative spikes it conducts at ~−0.7 V: R3 limits what reaches the chip's own diodes.</text>
    <text x="20" y="479">• No +5V wire needed. All GNDs common. Shielded cable: shield = GND = piezo black.</text>
    <text x="20" y="501">• Check D1 orientation with a multimeter (diode mode) BEFORE plugging into the Mega: band = signal side.</text>
    <text x="20" y="523">• Alternative with 2 Schottky diodes (BAT85) instead of D1 + R3: see docs/hardware.md.</text>
  </g>
</svg>
