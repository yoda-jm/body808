<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold" fill="#111">Wiring overview: 6 pads → Mega → MIDI out / radio / PC</text>

  <g stroke="#111" stroke-width="2" fill="none">
    <!-- signal lines pad -> protection -> Mega -->
    <line x1="200" y1="95"  x2="250" y2="95"/>  <line x1="400" y1="95"  x2="520" y2="95"/>
    <line x1="200" y1="165" x2="250" y2="165"/> <line x1="400" y1="165" x2="520" y2="165"/>
    <line x1="200" y1="235" x2="250" y2="235"/> <line x1="400" y1="235" x2="520" y2="235"/>
    <line x1="200" y1="305" x2="250" y2="305"/> <line x1="400" y1="305" x2="520" y2="305"/>
    <line x1="200" y1="375" x2="250" y2="375"/> <line x1="400" y1="375" x2="520" y2="375"/>
    <line x1="200" y1="445" x2="250" y2="445"/> <line x1="400" y1="445" x2="520" y2="445"/>
  </g>
  <!-- shared rails of the protection board -->
  <g stroke-width="3" fill="none">
    <line x1="470" y1="85" x2="470" y2="580" stroke="#111"/>
    <line x1="470" y1="580" x2="520" y2="580" stroke="#111"/>
  </g>
  <g stroke-width="2"><line x1="400" y1="115" x2="470" y2="115" stroke="#111"/><line x1="400" y1="185" x2="470" y2="185" stroke="#111"/><line x1="400" y1="255" x2="470" y2="255" stroke="#111"/><line x1="400" y1="325" x2="470" y2="325" stroke="#111"/><line x1="400" y1="395" x2="470" y2="395" stroke="#111"/><line x1="400" y1="465" x2="470" y2="465" stroke="#111"/>
  </g>
  <g fill="#111"><circle cx="470" cy="115" r="4"/><circle cx="470" cy="185" r="4"/><circle cx="470" cy="255" r="4"/><circle cx="470" cy="325" r="4"/><circle cx="470" cy="395" r="4"/><circle cx="470" cy="465" r="4"/></g>
  <!-- signal crosses rails: draw hop marks -->
  <g fill="#fff" stroke="none">
    <rect x="464" y="91" width="12" height="8"/>
    <rect x="464" y="161" width="12" height="8"/>
    <rect x="464" y="231" width="12" height="8"/>
    <rect x="464" y="301" width="12" height="8"/>
    <rect x="464" y="371" width="12" height="8"/>
    <rect x="464" y="441" width="12" height="8"/>
  </g>
  <g stroke="#111" stroke-width="2" fill="none">
    <path d="M462 95 q8 -12 16 0"/>
    <path d="M462 165 q8 -12 16 0"/>
    <path d="M462 235 q8 -12 16 0"/>
    <path d="M462 305 q8 -12 16 0"/>
    <path d="M462 375 q8 -12 16 0"/>
    <path d="M462 445 q8 -12 16 0"/>
  </g>

  <!-- pad boxes -->
  <g font-size="14">
    <g fill="#fdf3e6" stroke="#c98a3a" stroke-width="1.5">
      <rect x="20" y="75"  width="180" height="50" rx="6"/>
      <rect x="20" y="145" width="180" height="50" rx="6"/>
      <rect x="20" y="215" width="180" height="50" rx="6"/>
      <rect x="20" y="285" width="180" height="50" rx="6"/>
      <rect x="20" y="355" width="180" height="50" rx="6"/>
      <rect x="20" y="425" width="180" height="50" rx="6"/>
    </g>
    <g fill="#111">
      <text x="32" y="96" font-weight="bold">kick · note 36</text><text x="32" y="114" font-size="12">e.g. foot</text>
      <text x="32" y="166" font-weight="bold">snare · note 38</text><text x="32" y="184" font-size="12">e.g. leg</text>
      <text x="32" y="236" font-weight="bold">hihat · note 42</text><text x="32" y="254" font-size="12">e.g. other leg</text>
      <text x="32" y="306" font-weight="bold">bass · note 35</text><text x="32" y="324" font-size="12">e.g. chest</text>
      <text x="32" y="376" font-weight="bold">clap · note 39</text><text x="32" y="394" font-size="12">e.g. hand</text>
      <text x="32" y="446" font-weight="bold">openhat · note 46</text><text x="32" y="464" font-size="12">e.g. other hand</text>
    </g>
    <g fill="#eaf3fb" stroke="#3a7cc9" stroke-width="1.5">
      <rect x="250" y="75"  width="150" height="50" rx="6"/>
      <rect x="250" y="145" width="150" height="50" rx="6"/>
      <rect x="250" y="215" width="150" height="50" rx="6"/>
      <rect x="250" y="285" width="150" height="50" rx="6"/>
      <rect x="250" y="355" width="150" height="50" rx="6"/>
      <rect x="250" y="425" width="150" height="50" rx="6"/>
    </g>
    <g fill="#2a5f9e" font-size="12" text-anchor="middle">
      <text x="325" y="97">protection</text><text x="325" y="113">1M · 10k · 5V1 · 1k</text>
      <text x="325" y="167">protection</text><text x="325" y="183">1M · 10k · 5V1 · 1k</text>
      <text x="325" y="237">protection</text><text x="325" y="253">1M · 10k · 5V1 · 1k</text>
      <text x="325" y="307">protection</text><text x="325" y="323">1M · 10k · 5V1 · 1k</text>
      <text x="325" y="377">protection</text><text x="325" y="393">1M · 10k · 5V1 · 1k</text>
      <text x="325" y="447">protection</text><text x="325" y="463">1M · 10k · 5V1 · 1k</text>
    </g>
    <text x="205" y="88" font-size="11" fill="#555">jack</text>
    <text x="20" y="500" font-size="12" fill="#555">Placement is free: plug each pad into the sound you want.</text>
    <text x="20" y="516" font-size="12" fill="#555">Cable: shielded, 3.5 mm mono jack</text>
    <text x="20" y="532" font-size="12" fill="#555">(tip = piezo red, sleeve = black = GND)</text>
    <text x="330" y="576" font-size="12" fill="#111">GND rail (all pads)</text>
  </g>

  <!-- Mega -->
  <rect x="520" y="55" width="200" height="545" rx="10" fill="#0f6e74"/>
  <text x="620" y="300" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Arduino</text>
  <text x="620" y="322" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Mega 2560</text>
  <g fill="#fff" font-size="13" font-weight="bold">
    <text x="530" y="99">A0</text><text x="530" y="169">A1</text><text x="530" y="239">A2</text>
    <text x="530" y="309">A3</text><text x="530" y="379">A4</text><text x="530" y="449">A5</text>
    <text x="530" y="584">GND</text>
    <text x="710" y="124" text-anchor="end">TX1 (pin 18)</text>
    <text x="710" y="164" text-anchor="end">5V</text>
    <text x="710" y="204" text-anchor="end">GND</text>
    <text x="710" y="364" text-anchor="end">USB</text>
    <text x="710" y="484" text-anchor="end">VIN</text>
    <text x="710" y="524" text-anchor="end">GND</text>
  </g>

  <!-- MIDI out -->
  <g stroke="#111" stroke-width="2" fill="none">
    <line x1="720" y1="120" x2="770" y2="120"/><rect x="770" y="113" width="40" height="14" fill="#fff"/><line x1="810" y1="120" x2="840" y2="120"/>
    <line x1="720" y1="160" x2="770" y2="160"/><rect x="770" y="153" width="40" height="14" fill="#fff"/><line x1="810" y1="160" x2="840" y2="160"/>
    <line x1="720" y1="200" x2="840" y2="200"/>
    <line x1="720" y1="360" x2="840" y2="360"/>
    <line x1="720" y1="480" x2="840" y2="480"/>
    <line x1="720" y1="520" x2="840" y2="520"/>
  </g>
  <g font-size="11" fill="#111" text-anchor="middle"><text x="790" y="108">220 Ω</text><text x="790" y="148">220 Ω</text></g>
  <rect x="840" y="90" width="145" height="130" rx="6" fill="#f1ecfa" stroke="#6b4fb3" stroke-width="1.5"/>
  <g font-size="12" fill="#111">
    <text x="850" y="110" font-weight="bold">MIDI OUT DIN-5</text>
    <text x="850" y="124">pin 5</text>
    <text x="850" y="164">pin 4</text>
    <text x="850" y="204">pin 2 (shield)</text>
    <text x="840" y="238" font-size="11" fill="#555">→ plug the CME WIDI Master</text>
    <text x="840" y="252" font-size="11" fill="#555">here (Bluetooth MIDI out)</text>
  </g>

  <rect x="840" y="330" width="145" height="60" rx="6" fill="#eef5ea" stroke="#4f8a3a" stroke-width="1.5"/>
  <g font-size="12" fill="#111"><text x="850" y="352" font-weight="bold">PC / laptop</text><text x="850" y="368">upload, test, wired</text><text x="850" y="382">mode (USB serial)</text></g>

  <rect x="840" y="455" width="145" height="90" rx="6" fill="#fdecec" stroke="#b3261e" stroke-width="1.5"/>
  <g font-size="12" fill="#111"><text x="850" y="475" font-weight="bold">Power when worn</text><text x="850" y="491">7–12 V battery</text><text x="850" y="507">(+ VIN, − GND)</text><text x="850" y="523">or a USB power bank</text><text x="850" y="539">on the USB port</text></g>

  <text x="20" y="625" font-size="12" fill="#555">Protection per pad: see protection-circuit.svg. Never feed more than 5 V into any A-pin, and never connect a battery to the 5V pin (use VIN or USB).</text>
</svg>
