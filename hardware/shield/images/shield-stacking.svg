<svg xmlns="http://www.w3.org/2000/svg" width="962" height="670" font-family="DejaVu Sans, sans-serif"><rect width="100%" height="100%" fill="white"/><text x="40.0" y="66.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold">Today: pin headers under the shield</text><rect x="159.0" y="278.8" width="373.4" height="11.2" fill="#1b6b8f" stroke="none" fill-opacity="1"/><rect x="185.9" y="202.5" width="84.0" height="76.3" fill="#bbb" stroke="#777" fill-opacity="0.5" stroke-dasharray="4 3"/><rect x="167.9" y="219.3" width="17.8" height="59.5" fill="#222" stroke="none" fill-opacity="1"/><rect x="505.7" y="219.3" width="17.8" height="59.5" fill="#222" stroke="none" fill-opacity="1"/><text x="357.4" y="304.6" font-size="12" text-anchor="middle" fill="#1b6b8f">Arduino Mega</text><text x="227.9" y="248.0" font-size="11" text-anchor="middle" fill="#666">USB</text><text x="227.9" y="261.0" font-size="11" text-anchor="middle" fill="#666">socket</text><rect x="167.9" y="201.8" width="17.8" height="17.5" fill="#555" stroke="none" fill-opacity="1"/><rect x="174.5" y="180.8" width="4.5" height="80.5" fill="#d4a017" stroke="none" fill-opacity="1"/><rect x="505.7" y="201.8" width="17.8" height="17.5" fill="#555" stroke="none" fill-opacity="1"/><rect x="512.4" y="180.8" width="4.5" height="80.5" fill="#d4a017" stroke="none" fill-opacity="1"/><rect x="40.0" y="190.6" width="492.4" height="11.2" fill="#2e7d32" stroke="none" fill-opacity="1"/><rect x="40.0" y="133.2" width="91.0" height="57.4" fill="#333" stroke="none" fill-opacity="1"/><text x="85.5" y="159.8" font-size="11" text-anchor="middle" fill="#eee">jack</text><text x="357.4" y="184.6" font-size="12" text-anchor="middle" fill="#2e7d32">body808 shield</text><text x="550.4" y="159.8" font-size="12" text-anchor="start" fill="#222">Male pins under the shield go into the Mega's sockets.</text><text x="550.4" y="175.8" font-size="12" text-anchor="start" fill="#222">The plastic strip is under the board, soldered on top.</text><text x="550.4" y="191.8" font-size="12" text-anchor="start" fill="#222">A part under the board: you solder it, or the factory</text><text x="550.4" y="207.8" font-size="12" text-anchor="start" fill="#222">does it on its double-sided line (about $60 more).</text><text x="99.5" y="308.0" font-size="11" text-anchor="middle" fill="#666">overhang: 17 mm</text><line x1="40.0" y1="296.0" x2="159.0" y2="296.0" stroke="#999" stroke-width="1"/><text x="40.0" y="376.0" font-size="15" text-anchor="start" fill="#222" font-weight="bold">Option: stackable headers on top (JLCPCB has none in stock today)</text><rect x="159.0" y="588.8" width="373.4" height="11.2" fill="#1b6b8f" stroke="none" fill-opacity="1"/><rect x="185.9" y="512.5" width="84.0" height="76.3" fill="#bbb" stroke="#777" fill-opacity="0.5" stroke-dasharray="4 3"/><rect x="167.9" y="529.3" width="17.8" height="59.5" fill="#222" stroke="none" fill-opacity="1"/><rect x="505.7" y="529.3" width="17.8" height="59.5" fill="#222" stroke="none" fill-opacity="1"/><text x="357.4" y="614.6" font-size="12" text-anchor="middle" fill="#1b6b8f">Arduino Mega</text><text x="227.9" y="558.0" font-size="11" text-anchor="middle" fill="#666">USB</text><text x="227.9" y="571.0" font-size="11" text-anchor="middle" fill="#666">socket</text><rect x="167.9" y="438.3" width="17.8" height="59.5" fill="#222" stroke="none" fill-opacity="1"/><rect x="174.5" y="497.8" width="4.5" height="73.5" fill="#d4a017" stroke="none" fill-opacity="1"/><rect x="505.7" y="438.3" width="17.8" height="59.5" fill="#222" stroke="none" fill-opacity="1"/><rect x="512.4" y="497.8" width="4.5" height="73.5" fill="#d4a017" stroke="none" fill-opacity="1"/><rect x="40.0" y="497.8" width="492.4" height="11.2" fill="#2e7d32" stroke="none" fill-opacity="1"/><rect x="40.0" y="440.4" width="91.0" height="57.4" fill="#333" stroke="none" fill-opacity="1"/><text x="85.5" y="467.0" font-size="11" text-anchor="middle" fill="#eee">jack</text><text x="357.4" y="491.8" font-size="12" text-anchor="middle" fill="#2e7d32">body808 shield</text><text x="550.4" y="467.0" font-size="12" text-anchor="start" fill="#222">A socket strip sits on top; its long legs go through</text><text x="550.4" y="483.0" font-size="12" text-anchor="start" fill="#222">the board into the Mega's sockets.</text><text x="550.4" y="499.0" font-size="12" text-anchor="start" fill="#222">Every part is on top: the cheap one-sided factory job.</text><text x="99.5" y="618.0" font-size="11" text-anchor="middle" fill="#666">overhang: 17 mm</text><line x1="40.0" y1="606.0" x2="159.0" y2="606.0" stroke="#999" stroke-width="1"/><text x="40.0" y="650.0" font-size="12" text-anchor="start" fill="#555">Seen from the Mega's USB end, to scale. Both boards stay the right way up; the shield sits on top.</text></svg>
